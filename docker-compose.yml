# NexusRAG — one-command local stack.
#
#   1. cp backend/.env.example backend/.env   (then add your OPENAI_API_KEY)
#   2. docker compose up --build
#   3. open http://localhost:8080
#
# The frontend (nginx) serves the built SPA and reverse-proxies /api to the
# backend service, so everything is same-origin — including SSE streaming.

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Ensure paths resolve inside the container regardless of the .env values.
      STORAGE_DIR: /app/storage
      CHROMA_DIR: /app/storage/chroma
      DATABASE_URL: sqlite:////app/storage/nexusrag.db
    volumes:
      - nexus_storage:/app/storage
    expose:
      - "8000"
    # Uncomment to hit the API/docs directly during development:
    # ports:
    #   - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  nexus_storage:
